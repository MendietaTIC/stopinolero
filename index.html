<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Stop Pinolero - Juego Nicaragüense</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --azul-bandera: #1E3C72;
            --verde-naturaleza: #2E7D32;
            --amarillo-maiz: #F4C430;
            --naranja-atardecer: #F29B45;
            --blanco: #FFFFFF;
            --crema: #FFF8E7;
            --rojo-pinolero: #C62828;
            --sombra: 0 8px 20px rgba(0,0,0,0.15);
            --border-radius: 32px;
        }

        body {
            font-family: 'Comic Neue', 'Segoe UI', 'Poppins', cursive, sans-serif;
            background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B5 100%);
            min-height: 100vh;
            color: #2D2B2A;
            padding: 1rem;
            transition: background 0.3s, color 0.2s;
        }

        body.dark {
            background: linear-gradient(135deg, #1a2a2f 0%, #0f1a1f 100%);
            color: #E0E0E0;
        }

        body.dark .card {
            background: #2c3e34;
            border-color: var(--naranja-atardecer);
            color: #F0F0F0;
        }

        body.dark .cat-input {
            background: #3a4a3f;
        }

        body.dark .chat-box {
            background: #2a3a2f;
            color: #E0E0E0;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--blanco);
            border-radius: var(--border-radius);
            box-shadow: var(--sombra);
            padding: 1.8rem;
            margin-bottom: 1.8rem;
            border: 2px solid var(--amarillo-maiz);
            transition: background 0.3s;
        }

        .btn {
            background: var(--amarillo-maiz);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #b97f10;
            transition: 0.07s linear;
            font-family: inherit;
            margin: 0.25rem;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b97f10;
        }

        .btn-primary {
            background: var(--azul-bandera);
            color: white;
            box-shadow: 0 5px 0 #0f2a4a;
        }

        .btn-success {
            background: var(--verde-naturaleza);
            color: white;
            box-shadow: 0 5px 0 #1b5e20;
        }

        .btn-stop {
            background: var(--rojo-pinolero);
            color: white;
            font-size: 1.8rem;
            padding: 16px 28px;
            animation: pulse 1s infinite;
            box-shadow: 0 5px 0 #8b0000;
        }

        @keyframes pulse {
            0% { transform: scale(1); background: #c62828; }
            50% { transform: scale(1.05); background: #e53935; }
            100% { transform: scale(1); background: #c62828; }
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            background: rgba(255, 245, 220, 0.95);
            border-radius: 80px;
            padding: 0.8rem 1.8rem;
            margin-bottom: 1.5rem;
            border: 2px solid var(--amarillo-maiz);
        }
        body.dark .user-header {
            background: #2c3e34;
        }

        .avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--naranja-atardecer), #F57C00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            max-width: 600px;
            width: 90%;
            border-radius: 48px;
            padding: 2rem;
            text-align: center;
            border: 4px solid var(--amarillo-maiz);
            max-height: 80vh;
            overflow-y: auto;
        }

        body.dark .modal-content {
            background: #2c3e34;
            color: #E0E0E0;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .category-grid {
            display: grid;
            gap: 1rem;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        }

        .cat-input {
            background: #FFF2DF;
            border-radius: 28px;
            padding: 8px 12px;
        }

        .cat-input label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input, select, textarea {
            padding: 10px 16px;
            border-radius: 60px;
            border: 2px solid var(--amarillo-maiz);
            font-family: inherit;
            width: 100%;
        }

        .chat-box {
            background: #F7F2E7;
            border-radius: 28px;
            height: 280px;
            overflow-y: auto;
            padding: 1rem;
            border: 2px solid var(--amarillo-maiz);
        }

        .inline-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .answers-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .answers-table th, .answers-table td {
            border: 1px solid var(--amarillo-maiz);
            padding: 8px;
            text-align: left;
        }
        .vote-btn {
            background: #e0e0e0;
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .vote-btn.invalid {
            background: #f44336;
            color: white;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            font-size: 0.9rem;
            border-top: 1px solid var(--amarillo-maiz);
        }

        @media (max-width: 768px) {
            .btn { padding: 8px 16px; font-size: 0.85rem; }
            .avatar { width: 50px; height: 50px; font-size: 1.8rem; }
            .card { padding: 1rem; }
        }
    </style>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, arrayUnion, arrayRemove, query, where, orderBy, limit, onSnapshot, addDoc, serverTimestamp, deleteDoc, increment, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCcUGTXDuC5Oi3xVdAjn1IeszXzcewvJD8",
            authDomain: "stopinolero-3a9fe.firebaseapp.com",
            projectId: "stopinolero-3a9fe",
            storageBucket: "stopinolero-3a9fe.firebasestorage.app",
            messagingSenderId: "981024606261",
            appId: "1:981024606261:web:649c3d300caa214ddd497c",
            measurementId: "G-0JCYC7KEYZ"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        let currentUserData = null;
        let currentRoomUnsub = null;
        let currentTimer = null;
        
        const authScreen = document.getElementById('authScreen');
        const mainPanel = document.getElementById('mainPanel');
        const googleBtn = document.getElementById('googleLoginBtn');
        const guestBtn = document.getElementById('guestLoginBtn');
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomCodeFromUrl = urlParams.get('room');
        
        async function updateUserUI() {
            if(!currentUserData) return;
            document.getElementById('userLevel').innerText = currentUserData.nivel || "Novato Pinolero";
            document.getElementById('userPoints').innerText = currentUserData.puntosGlobales || 0;
            document.getElementById('userWins').innerText = currentUserData.victorias || 0;
            const header = document.getElementById('userHeader');
            if(header) {
                header.innerHTML = `<div class="avatar">${currentUserData.avatar || '🇳🇮'}</div>
                                    <div><strong>${currentUserData.nombre}</strong><br>⭐ ${currentUserData.puntosGlobales || 0} pts</div>
                                    <button id="logoutBtn" class="btn">🚪 Salir</button>`;
                document.getElementById('logoutBtn')?.addEventListener('click', async () => {
                    await signOut(auth);
                    window.location.href = window.location.pathname;
                });
            }
        }
        
        async function saveUserToFirestore(user, isGuest = false, guestName = null) {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            const displayName = guestName || user.displayName || `Pinolero${Math.floor(Math.random()*1000)}`;
            const avatar = ["🌽","🦜","🌋","🏝️","🎭","🇳🇮"][Math.floor(Math.random()*6)];
            if(!snap.exists()){
                await setDoc(userRef, {
                    uid: user.uid,
                    nombre: displayName,
                    avatar: avatar,
                    nivel: "Novato Pinolero",
                    experiencia: 0,
                    puntosGlobales: 0,
                    victorias: 0,
                    partidasJugadas: 0,
                    mejorPuntuacion: 0,
                    isGuest: isGuest
                });
            }
            const data = (await getDoc(userRef)).data();
            currentUserData = { uid: user.uid, ...data };
            updateUserUI();
            loadMainMenu();
            if(roomCodeFromUrl) setTimeout(() => joinRoomWithCode(roomCodeFromUrl), 1000);
        }
        
        onAuthStateChanged(auth, async (user) => {
            if(user){
                await saveUserToFirestore(user, user.isAnonymous, user.displayName);
                authScreen.style.display = 'none';
                mainPanel.style.display = 'block';
            } else {
                authScreen.style.display = 'flex';
                mainPanel.style.display = 'none';
            }
        });
        
        googleBtn.onclick = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                console.log("Google login exitoso", result.user);
            } catch (error) {
                console.error("Error Google:", error);
                alert("Error al iniciar con Google. Asegúrate de que el proveedor esté habilitado en Firebase Console (Authentication -> Sign-in methods -> Google).");
            }
        };
        guestBtn.onclick = async () => {
            const cred = await signInAnonymously(auth);
            const randomName = "Viajero@" + Math.floor(Math.random()*1000);
            await saveUserToFirestore(cred.user, true, randomName);
        };
        
        function openModal(id){ document.getElementById(id).style.display = 'flex'; }
        function closeModals(){ document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        document.querySelectorAll('.closeModal').forEach(btn => btn.addEventListener('click', closeModals));
        
        document.getElementById('createRoomBtn').onclick = () => openModal('createRoomModal');
        document.getElementById('joinRoomBtn').onclick = () => openModal('joinRoomModal');
        
        function setupCustomCategories() {
            const container = document.getElementById('customCategoriesContainer');
            if(!container) return;
            container.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const div = document.createElement('div');
                div.className = 'cat-input';
                div.innerHTML = `<label>🔖 Categoría ${i}</label><input type="text" id="cat${i}" placeholder="Ej: Volcán, Comida típica...">`;
                container.appendChild(div);
            }
        }
        document.getElementById('catStyleSelect')?.addEventListener('change', (e) => {
            const customDiv = document.getElementById('customCategoriesSection');
            if(e.target.value === 'custom') {
                customDiv.style.display = 'block';
                setupCustomCategories();
            } else {
                customDiv.style.display = 'none';
            }
        });
        
        document.getElementById('confirmCreateRoom').onclick = async () => {
            if(!currentUserData) return;
            const roomName = document.getElementById('roomName').value.trim() || "Sala Pinolera";
            const maxPlayers = parseInt(document.getElementById('maxPlayers').value);
            const roundTime = parseInt(document.getElementById('roundTime').value);
            const numRounds = parseInt(document.getElementById('numRounds').value);
            const catStyle = document.getElementById('catStyleSelect').value;
            let categories = [];
            if(catStyle === 'custom') {
                for(let i=1; i<=5; i++) {
                    let val = document.getElementById(`cat${i}`)?.value.trim();
                    if(val) categories.push(val);
                }
                if(categories.length === 0) categories = ["Categoría 1", "Categoría 2", "Categoría 3", "Categoría 4", "Categoría 5"];
            } else if(catStyle === 'classic') {
                categories = ["Nombre", "Animal", "Lugar", "Cosa", "Comida"];
            } else {
                categories = ["Municipio", "Volcán", "Comida típica", "Tradición", "Sitio turístico"];
            }
            const roomId = Math.random().toString(36).substring(2,8).toUpperCase();
            await setDoc(doc(db, "rooms", roomId), {
                roomId, roomName, host: currentUserData.uid, maxPlayers, roundTime, numRounds,
                categories: categories,
                players: [{uid: currentUserData.uid, nombre: currentUserData.nombre, avatar: currentUserData.avatar, total: 0}],
                state: "waiting",
                currentRound: 0,
                currentLetter: null,
                stopTriggered: false
            });
            await addDoc(collection(db, "rooms", roomId, "messages"), { sender: "Sistema", text: `${currentUserData.nombre} creó la sala`, timestamp: serverTimestamp() });
            const roomLink = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            alert(`✅ Sala creada!\nCódigo: ${roomId}\nEnlace: ${roomLink}`);
            if(confirm("¿Compartir enlace por WhatsApp?")) {
                window.open(`https://wa.me/?text=¡Únete a Stop Pinolero! ${encodeURIComponent(roomLink)}`, '_blank');
            }
            loadRoomView(roomId);
            closeModals();
        };
        
        async function joinRoomWithCode(code) {
            const roomRef = doc(db, "rooms", code);
            const snap = await getDoc(roomRef);
            if(!snap.exists()) { alert("Sala no encontrada"); return; }
            const room = snap.data();
            if(room.players.some(p => p.uid === currentUserData.uid)) { loadRoomView(code); return; }
            if(room.players.length >= room.maxPlayers) { alert("Sala llena"); return; }
            await updateDoc(roomRef, {
                players: arrayUnion({uid: currentUserData.uid, nombre: currentUserData.nombre, avatar: currentUserData.avatar, total: 0})
            });
            await addDoc(collection(db, "rooms", code, "messages"), { sender: "Sistema", text: `${currentUserData.nombre} se unió`, timestamp: serverTimestamp() });
            loadRoomView(code);
        }
        
        document.getElementById('confirmJoinRoom').onclick = async () => {
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            await joinRoomWithCode(code);
            closeModals();
        };
        
        function loadMainMenu() {
            if(currentRoomUnsub) currentRoomUnsub();
            document.getElementById('dynamicView').innerHTML = `<div class="card"><h2>🎮 ¡Bienvenido a Stop Pinolero!</h2><p>🇳🇮 Demuestra tu conocimiento. Crea una sala personalizada o únete con código.</p><div style="text-align:center"><img src="https://cdn-icons-png.flaticon.com/512/1999/1999625.png" width="80"></div></div>`;
        }
        
        async function loadRoomView(roomId) {
            if(currentRoomUnsub) currentRoomUnsub();
            const roomRef = doc(db, "rooms", roomId);
            currentRoomUnsub = onSnapshot(roomRef, async (roomSnap) => {
                if(!roomSnap.exists()){ alert("Sala eliminada"); loadMainMenu(); return; }
                const room = roomSnap.data();
                const isHost = room.host === currentUserData.uid;
                const playersList = room.players;
                let html = `<div class="card"><h2>🏠 ${room.roomName} (Código: ${roomId})</h2>
                            <div class="grid-2">
                                <div><h3>👥 Jugadores (${playersList.length}/${room.maxPlayers})</h3><ul>`;
                playersList.forEach(p => html += `<li>${p.avatar || '🎭'} ${p.nombre} - ${p.total} pts</li>`);
                html += `</ul>${isHost && room.state === 'waiting' ? '<button id="startGameBtn" class="btn btn-success">🚀 Iniciar Partida</button>' : '<p>⏳ Esperando al anfitrión...</p>'}
                        <div class="inline-buttons"><button id="copyLinkBtn" class="btn">🔗 Copiar enlace</button><button id="whatsappShareBtn" class="btn">📱 WhatsApp</button></div>
                        </div>
                         <div><h3>💬 Chat</h3><div id="chatMessages" class="chat-box"></div>
                         <input id="chatInput" placeholder="Escribe un mensaje..."><button id="sendChat" class="btn">Enviar</button></div>
                         </div></div>`;
                document.getElementById('dynamicView').innerHTML = html;
                const roomLink = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
                document.getElementById('copyLinkBtn')?.addEventListener('click', () => { navigator.clipboard.writeText(roomLink); alert("Enlace copiado"); });
                document.getElementById('whatsappShareBtn')?.addEventListener('click', () => { window.open(`https://wa.me/?text=¡Únete a Stop Pinolero! ${encodeURIComponent(roomLink)}`, '_blank'); });
                
                const chatQuery = query(collection(db, "rooms", roomId, "messages"), orderBy("timestamp", "asc"));
                onSnapshot(chatQuery, (snap) => {
                    const chatDiv = document.getElementById('chatMessages');
                    if(chatDiv) chatDiv.innerHTML = snap.docs.map(d => `<div><b>${d.data().sender}</b>: ${d.data().text}</div>`).join('');
                });
                document.getElementById('sendChat')?.addEventListener('click', async () => {
                    const msg = document.getElementById('chatInput').value;
                    if(msg) await addDoc(collection(db, "rooms", roomId, "messages"), { sender: currentUserData.nombre, text: msg, timestamp: serverTimestamp() });
                    document.getElementById('chatInput').value = '';
                });
                
                if(isHost && room.state === 'waiting') {
                    document.getElementById('startGameBtn')?.addEventListener('click', async () => {
                        const letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                        await updateDoc(roomRef, { state: "playing", currentRound: 1, currentLetter: letter, roundStart: serverTimestamp(), stopTriggered: false });
                        await addDoc(collection(db, "rooms", roomId, "messages"), { sender: "Sistema", text: `🎲 ¡Ronda 1! Letra: ${letter}`, timestamp: serverTimestamp() });
                        renderGameInterface(roomId, { ...room, currentRound: 1, currentLetter: letter });
                    });
                }
                if(room.state === "playing") await renderGameInterface(roomId, room);
            });
        }
        
        async function renderGameInterface(roomId, room) {
            const categories = room.categories;
            const html = `<div class="card"><h2>🎲 Ronda ${room.currentRound}/${room.numRounds} | Letra: ${room.currentLetter}</h2>
                         <div id="timerDisplay" style="font-size:2.5rem; font-weight:bold; text-align:center">⏱️ --</div>
                         <button id="stopBtnGlobal" class="btn btn-stop">🛑 STOP</button>
                         <form id="answersForm"><div class="category-grid" id="catsGrid"></div><button type="submit" class="btn btn-primary">📝 Guardar respuestas</button></form></div>
                         <div id="roundResults"></div>`;
            document.getElementById('dynamicView').innerHTML = html;
            const container = document.getElementById('catsGrid');
            categories.forEach(cat => {
                container.innerHTML += `<div class="cat-input"><label>${cat}</label><input name="${cat}" placeholder="Palabra con ${room.currentLetter}..."></div>`;
            });
            let timeLeft = room.roundTime;
            const timerElem = document.getElementById('timerDisplay');
            if(currentTimer) clearInterval(currentTimer);
            currentTimer = setInterval(async () => {
                if(timeLeft <= 0) {
                    clearInterval(currentTimer);
                    await finishRound(roomId);
                } else {
                    timerElem.innerText = `⏱️ ${timeLeft} segundos`;
                    timeLeft--;
                }
            }, 1000);
            
            document.getElementById('stopBtnGlobal')?.addEventListener('click', async () => {
                const roomSnap = await getDoc(doc(db, "rooms", roomId));
                if(roomSnap.data().stopTriggered) return;
                await updateDoc(doc(db, "rooms", roomId), { stopTriggered: true });
                await addDoc(collection(db, "rooms", roomId, "messages"), { sender: "Sistema", text: `${currentUserData.nombre} presionó STOP! ⏰ 10 segundos restantes`, timestamp: serverTimestamp() });
                setTimeout(() => finishRound(roomId), 10000);
            });
            
            document.getElementById('answersForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const answers = {};
                categories.forEach(cat => { answers[cat] = document.querySelector(`[name="${cat}"]`).value.trim().toLowerCase() || ""; });
                await setDoc(doc(db, "rooms", roomId, "answers", currentUserData.uid), { uid: currentUserData.uid, answers, round: room.currentRound });
            });
        }
        
        async function finishRound(roomId) {
            clearInterval(currentTimer);
            const roomRef = doc(db, "rooms", roomId);
            const roomSnap = await getDoc(roomRef);
            const room = roomSnap.data();
            if(!room) return;
            
            // Obtener respuestas
            const answersSnap = await getDocs(collection(db, `rooms/${roomId}/answers`));
            const allAnswers = {};
            answersSnap.forEach(docu => { allAnswers[docu.id] = docu.data(); });
            
            // Mostrar interfaz de votación
            const categoriesList = room.categories;
            const playersList = room.players;
            
            let votingHtml = `<div class="card"><h3>📋 Validar respuestas - Ronda ${room.currentRound}</h3><p>Cada jugador puede marcar como incorrecta una respuesta (pulgar abajo). Mayoría de votos la anula.</p>`;
            for(let cat of categoriesList) {
                votingHtml += `<h4>📌 ${cat}</h4><table class="answers-table"><tr><th>Jugador</th><th>Respuesta</th><th>Votar incorrecta</th></tr>`;
                for(let player of playersList) {
                    const answerObj = allAnswers[player.uid];
                    const word = answerObj && answerObj.round === room.currentRound ? (answerObj.answers[cat] || "") : "";
                    const votesRef = collection(db, "rooms", roomId, "votes");
                    const qVotes = query(votesRef, where("round", "==", room.currentRound), where("category", "==", cat), where("playerUid", "==", player.uid));
                    const voteSnap = await getDocs(qVotes);
                    const isInvalid = voteSnap.size > (playersList.length / 2);
                    votingHtml += `<tr>
                        <td>${player.nombre}</td>
                        <td>${word || "(vacío)"}</td>
                        <td><button class="vote-btn ${isInvalid ? 'invalid' : ''}" data-cat="${cat}" data-player="${player.uid}">👍❌</button></td>
                    </tr>`;
                }
                votingHtml += `</table><br>`;
            }
            votingHtml += `<button id="finalizeVotingBtn" class="btn btn-primary">✅ Finalizar ronda y calcular puntos</button></div>`;
            document.getElementById('dynamicView').innerHTML = votingHtml;
            
            // Lógica de votos
            const voteButtons = document.querySelectorAll('.vote-btn');
            voteButtons.forEach(btn => {
                btn.addEventListener('click', async () => {
                    const category = btn.dataset.cat;
                    const playerUid = btn.dataset.player;
                    const votesRef = doc(db, "rooms", roomId, "votes", `${room.currentRound}_${category}_${playerUid}_${currentUserData.uid}`);
                    await setDoc(votesRef, { round: room.currentRound, category, playerUid, voter: currentUserData.uid, timestamp: serverTimestamp() });
                    btn.classList.toggle('invalid');
                });
            });
            
            document.getElementById('finalizeVotingBtn')?.addEventListener('click', async () => {
                // Recolectar votos y calcular puntajes finales
                const votesRef = collection(db, "rooms", roomId, "votes");
                const allVotesSnap = await getDocs(votesRef);
                const invalidMap = new Map(); // key: `${category}_${playerUid}`
                for(let vote of allVotesSnap.docs) {
                    const v = vote.data();
                    if(v.round === room.currentRound) {
                        const key = `${v.category}_${v.playerUid}`;
                        if(!invalidMap.has(key)) invalidMap.set(key, []);
                        invalidMap.get(key).push(v.voter);
                    }
                }
                const invalidSet = new Set();
                for(let [key, voters] of invalidMap.entries()) {
                    if(voters.length > (playersList.length / 2)) invalidSet.add(key);
                }
                
                // Calcular puntuación con anulaciones
                const scores = {};
                playersList.forEach(p => scores[p.uid] = 0);
                for(let cat of categoriesList) {
                    const wordMap = new Map(); // word -> array de uids no anulados
                    for(let player of playersList) {
                        const key = `${cat}_${player.uid}`;
                        if(invalidSet.has(key)) continue; // anulada
                        const answerObj = allAnswers[player.uid];
                        const word = answerObj && answerObj.round === room.currentRound ? (answerObj.answers[cat] || "").trim() : "";
                        if(word && word !== "") {
                            if(!wordMap.has(word)) wordMap.set(word, []);
                            wordMap.get(word).push(player.uid);
                        }
                    }
                    for(let [word, uids] of wordMap.entries()) {
                        let points = (uids.length === 1) ? 2 : 1;
                        uids.forEach(uid => scores[uid] += points);
                    }
                }
                let maxScore = 0, winnerUid = null;
                for(let [uid, pts] of Object.entries(scores)) {
                    if(pts > maxScore) { maxScore = pts; winnerUid = uid; }
                }
                const newPlayers = room.players.map(p => {
                    let add = scores[p.uid] || 0;
                    let bonus = (p.uid === winnerUid) ? 5 : 0;
                    let newTotal = p.total + add + bonus;
                    return { ...p, total: newTotal };
                });
                await updateDoc(roomRef, { players: newPlayers, stopTriggered: false });
                await addDoc(collection(db, "rooms", roomId, "messages"), { sender: "Sistema", text: `📊 Ronda ${room.currentRound}: ${winnerUid === currentUserData.uid ? "¡Ganaste! +5" : "Finalizada"}`, timestamp: serverTimestamp() });
                if(room.currentRound >= room.numRounds) {
                    finalizeGame(roomId);
                } else {
                    const newLetter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
                    await updateDoc(roomRef, { currentRound: increment(1), currentLetter: newLetter, roundStart: serverTimestamp(), stopTriggered: false });
                    await addDoc(collection(db, "rooms", roomId, "messages"), { sender: "Sistema", text: `🔄 Nueva Ronda ${room.currentRound+1} - Letra: ${newLetter}`, timestamp: serverTimestamp() });
                    const updatedRoom = (await getDoc(roomRef)).data();
                    renderGameInterface(roomId, updatedRoom);
                }
            });
        }
        
        async function finalizeGame(roomId) {
            const roomRef = doc(db, "rooms", roomId);
            const snap = await getDoc(roomRef);
            const room = snap.data();
            const sorted = [...room.players].sort((a,b) => b.total - a.total);
            const winner = sorted[0];
            const userRef = doc(db, "users", winner.uid);
            await updateDoc(userRef, { victorias: increment(1), partidasJugadas: increment(1), puntosGlobales: increment(winner.total) });
            await addDoc(collection(db, "rooms", roomId, "messages"), { sender: "Sistema", text: `🏆 ¡FIN! Ganador: ${winner.nombre} (${winner.total} pts)`, timestamp: serverTimestamp() });
            document.getElementById('dynamicView').innerHTML = `<div class="card"><h2>🏁 Partida finalizada</h2>
                <p>🥇 ${sorted[0]?.nombre} - ${sorted[0]?.total} pts</p>
                <p>🥈 ${sorted[1]?.nombre} - ${sorted[1]?.total} pts</p>
                <p>🥉 ${sorted[2]?.nombre} - ${sorted[2]?.total} pts</p>
                <button class="btn" onclick="location.reload()">Volver al inicio</button></div>`;
            await updateDoc(roomRef, { state: "finished" });
        }
        
        // Ranking, Amigos, Perfil, Config
        document.getElementById('rankingBtn').onclick = async () => {
            const q = query(collection(db, "users"), orderBy("puntosGlobales", "desc"), limit(20));
            const snap = await getDocs(q);
            let rankHtml = `<div class="card"><h2>🏆 Ranking Global</h2><ol>`;
            snap.forEach(docu => { let d = docu.data(); rankHtml += `<li><strong>${d.nombre}</strong> - ${d.puntosGlobales || 0} pts - ${d.nivel}</li>`; });
            rankHtml += `</ol></div>`;
            document.getElementById('dynamicView').innerHTML = rankHtml;
        };
        
        document.getElementById('friendsBtn').onclick = async () => {
            const q = query(collection(db, "friends"), where("usuario", "==", currentUserData.uid), where("estado", "==", "aceptado"));
            const snap = await getDocs(q);
            let html = `<div class="card"><h2>👥 Mis Amigos</h2><input id="searchFriend" placeholder="Buscar por nombre..."><button id="searchBtn" class="btn">🔍 Buscar</button><ul id="friendList">`;
            snap.forEach(d => html += `<li>👤 ${d.data().amigoNombre || d.data().amigo}</li>`);
            html += `</ul></div>`;
            document.getElementById('dynamicView').innerHTML = html;
            document.getElementById('searchBtn').onclick = async () => {
                const search = document.getElementById('searchFriend').value;
                const userQuery = query(collection(db, "users"), where("nombre", ">=", search), where("nombre", "<=", search + "\uf8ff"), limit(5));
                const res = await getDocs(userQuery);
                let list = '<h4>Resultados</h4>';
                res.forEach(u => {
                    if(u.id !== currentUserData.uid) list += `<div>${u.data().nombre} <button class="sendRequestBtn" data-uid="${u.id}">➕ Agregar</button></div>`;
                });
                document.getElementById('friendList').innerHTML = list;
                document.querySelectorAll('.sendRequestBtn').forEach(btn => btn.addEventListener('click', async () => {
                    const friendId = btn.dataset.uid;
                    const friendDoc = await getDoc(doc(db, "users", friendId));
                    await setDoc(doc(db, "friends", `${currentUserData.uid}_${friendId}`), { usuario: currentUserData.uid, amigo: friendId, estado: "pendiente", amigoNombre: friendDoc.data().nombre });
                    alert("Solicitud enviada");
                }));
            };
        };
        
        document.getElementById('profileBtn').onclick = () => {
            const u = currentUserData;
            document.getElementById('dynamicView').innerHTML = `<div class="card"><h2>👤 Mi Perfil</h2>
                <p>🎭 Avatar: ${u.avatar}</p><p>📛 Nombre: ${u.nombre}</p>
                <p>🏅 Nivel: ${u.nivel}</p><p>⭐ Experiencia: ${u.experiencia}</p>
                <p>💰 Puntos: ${u.puntosGlobales}</p><p>🎮 Partidas: ${u.partidasJugadas}</p>
                <p>🏆 Victorias: ${u.victorias}</p>
                <button id="toggleDark">🌙 Modo Oscuro</button>
                <button id="shareProfile">🔗 Compartir perfil</button></div>`;
            document.getElementById('toggleDark')?.addEventListener('click', () => { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark')); });
            document.getElementById('shareProfile')?.addEventListener('click', () => { alert(`Comparte: ${window.location.origin}/u/${currentUserData.uid}`); });
            if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
        };
        
        document.getElementById('settingsBtn').onclick = () => {
            document.getElementById('dynamicView').innerHTML = `<div class="card"><h2>⚙️ Configuración</h2>
                <label><input type="checkbox" id="soundToggle"> 🔊 Activar sonidos</label><br>
                <button id="saveSettings" class="btn">Guardar</button></div>`;
            document.getElementById('saveSettings').onclick = () => { alert("Preferencias guardadas"); };
        };
        
        if(localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');
        window.loadRoomView = loadRoomView;
    </script>
</head>
<body>
<div class="app-container" id="appRoot">
    <div id="authScreen" class="card" style="text-align:center">
        <h1 style="color:var(--azul-bandera); font-size:2.5rem;">🇳🇮 Stop Pinolero 🎉</h1>
        <p style="font-size:1.2rem">¡El clásico Stop con sabor Nicaragüense! Personaliza tus categorías y compite en línea.</p>
        <div style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap; margin-top:2rem">
            <button id="googleLoginBtn" class="btn btn-primary">🔐 Ingresar con Google</button>
            <button id="guestLoginBtn" class="btn">🎭 Modo Invitado</button>
        </div>
    </div>
    <div id="mainPanel" style="display:none">
        <div class="user-header" id="userHeader"></div>
        <div class="grid-2">
            <div class="card">
                <h3>📊 Mis Estadísticas</h3>
                <p>🏆 Nivel: <span id="userLevel">Novato</span></p>
                <p>⭐ Puntos: <span id="userPoints">0</span></p>
                <p>🎮 Victorias: <span id="userWins">0</span></p>
            </div>
            <div class="card">
                <div style="display:flex; gap:12px; flex-wrap:wrap">
                    <button id="createRoomBtn" class="btn btn-success">➕ Crear Sala</button>
                    <button id="joinRoomBtn" class="btn">🔗 Unirse a Sala</button>
                    <button id="rankingBtn" class="btn">🏅 Ranking</button>
                    <button id="friendsBtn" class="btn">👥 Amigos</button>
                    <button id="profileBtn" class="btn">👤 Mi Perfil</button>
                    <button id="settingsBtn" class="btn">⚙️ Config</button>
                </div>
            </div>
        </div>
        <div id="dynamicView"></div>
    </div>
    <!-- Modal Crear Sala -->
    <div id="createRoomModal" class="modal"><div class="modal-content"><h3>➕ Crear Sala Personalizada</h3>
        <input type="text" id="roomName" placeholder="Nombre de la sala"><br><br>
        <label>👥 Máximo jugadores:</label>
        <select id="maxPlayers"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select><br><br>
        <label>⏱️ Tiempo por ronda:</label>
        <select id="roundTime"><option value="60">60 segundos</option><option value="90">90 segundos</option><option value="120">120 segundos</option></select><br><br>
        <label>🔄 Número de rondas:</label>
        <select id="numRounds"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><br><br>
        <label>📋 Estilo de categorías:</label>
        <select id="catStyleSelect">
            <option value="classic">Clásicas (Nombre, Animal, Lugar, Cosa, Comida)</option>
            <option value="pinolera">Pinoleras (Municipio, Volcán, Comida típica, Tradición, Sitio turístico)</option>
            <option value="custom">🎨 Personalizado (escribe tus 5 categorías)</option>
        </select><br><br>
        <div id="customCategoriesSection" style="display:none;">
            <label>📝 Escribe 5 categorías a buscar:</label>
            <div id="customCategoriesContainer"></div>
        </div>
        <button id="confirmCreateRoom" class="btn btn-success">✅ Crear Sala y obtener enlace</button>
        <button class="closeModal">Cancelar</button>
    </div></div>
    <!-- Modal Unirse -->
    <div id="joinRoomModal" class="modal"><div class="modal-content"><h3>🔗 Unirse a Sala</h3>
        <input id="roomCodeInput" placeholder="Código de sala (ej. A3F7K2)"><br><br>
        <button id="confirmJoinRoom" class="btn">Unirse</button>
        <button class="closeModal">Cerrar</button>
    </div></div>
    <footer>
        <p>Código pinolero</p>
        <p>Creado por Juan Mendieta</p>
    </footer>
</div>
</body>
</html>

    <style>
        * {
            margin: 0;
            padding: 0;

        }

        :root {
            --azul-bandera: #1E3C72;

<body>
<div class="app-container" id="appRoot">
    <!-- Pantalla de autenticación inicial -->
    <div id="authScreen" class="card" style="text-align:center">

        </div>
    </div>

    <!-- Panel Principal (después de login) -->
    <div id="mainPanel" style="display:none">
        <div class="user-header" id="userHeader"></div>
        <div class="grid-2">
            <div class="card">
                <h3>📊 Estadísticas</h3>
                <p>🏆 Nivel: <span id="userLevel">Novato</span></p>
                <p>⭐ Puntos: <span id="userPoints">0</span></p>
                <p>🎮 Victorias: <span id="userWins">0</span></p>
            </div>
            <div class="card">
                <div style="display:flex; gap:10px; flex-wrap:wrap">
                    <button id="createRoomBtn" class="btn btn-success">➕ Crear Sala</button>
                    <button id="joinRoomBtn" class="btn">🔗 Unirse a Sala</button>
                    <button id="rankingBtn" class="btn">🏅 Ranking</button>
                    <button id="friendsBtn" class="btn">👥 Amigos</button>
                    <button id="profileBtn" class="btn">👤 Mi Perfil</button>
                    <button id="settingsBtn" class="btn">⚙️ Config</button>
                </div>
            </div>
        </div>
        <div id="dynamicView"></div>
    </div>

    <!-- Modales comunes -->
    <div id="createRoomModal" class="modal"><div class="modal-content"><h3>Crear Sala</h3><input type="text" id="roomName" placeholder="Nombre de sala"><select id="maxPlayers"><option>4</option><option>6</option><option>8</option></select><select id="roundTime"><option>30</option><option>60</option><option>90</option></select><select id="numRounds"><option>3</option><option>5</option></select><select id="catType"><option value="classic">Clásicas</option><option value="pinolera">Pinoleras</option></select><button id="confirmCreateRoom" class="btn">Crear</button><button class="closeModal">Cancelar</button></div></div>
    <div id="joinRoomModal" class="modal"><div class="modal-content"><h3>Unirse con código</h3><input id="roomCodeInput" placeholder="Código de sala"><button id="confirmJoinRoom">Unirse</button><button class="closeModal">Cerrar</button></div></div>
</div>
<script type="module" src="./app.js"></script>
<script type="module">
    // app.js contenido principal - Módulo completo
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, signOut, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, arrayUnion, arrayRemove, query, where, orderBy, limit, onSnapshot, addDoc, serverTimestamp, deleteDoc, increment, runTransaction } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";
    import { getStorage, ref } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-storage.js";

    const app = initializeApp(window.firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUserData = null;
    let unsubscribeRooms = null;
    
    // UI Elements
    const authScreen = document.getElementById('authScreen');
    const mainPanel = document.getElementById('mainPanel');
    const googleBtn = document.getElementById('googleLoginBtn');
    const guestBtn = document.getElementById('guestLoginBtn');
    
    const categoriesMap = {
        classic: ["Nombre","Animal","Ciudad","País","Comida","Profesión","Objeto"],
        pinolera: ["Municipio","Departamento","Volcán","Río","Comida típica","Tradición","Personaje histórico","Sitio turístico"]
    };
    
    async function updateUserUI() {
        if(!currentUserData) return;
        document.getElementById('userLevel').innerText = currentUserData.nivel || "Novato";
        document.getElementById('userPoints').innerText = currentUserData.puntosGlobales || 0;
        document.getElementById('userWins').innerText = currentUserData.victorias || 0;
        document.getElementById('userHeader').innerHTML = `<div class="avatar">${currentUserData.avatar || '👤'}</div><div><strong>${currentUserData.nombre}</strong><br>⭐${currentUserData.puntosGlobales || 0}</div><button id="logoutBtn" class="btn">🚪 Salir</button>`;
        document.getElementById('logoutBtn')?.addEventListener('click', async()=>{ await signOut(auth); location.reload(); });
    }
    
    async function saveUserToFirestore(user, isGuest=false, guestName=null) {
        const userRef = doc(db, "users", user.uid);
        const snap = await getDoc(userRef);
        const displayName = guestName || user.displayName || `Pinolero${Math.floor(Math.random()*1000)}`;
        const avatar = "🎲"+["🌽","🦜","🌋","🏝️"][Math.floor(Math.random()*4)];
        if(!snap.exists()){
            await setDoc(userRef, {
                uid: user.uid,
                nombre: displayName,
                avatar: avatar,
                nivel: "Novato Pinolero",
                experiencia: 0,
                puntosGlobales: 0,
                victorias: 0,
                partidasJugadas: 0,
                mejorPuntuacion: 0,
                isGuest: isGuest
            });
        }
        const data = (await getDoc(userRef)).data();
        currentUserData = { uid: user.uid, ...data };
        updateUserUI();
        loadMainMenu();
    }
    
    onAuthStateChanged(auth, async(user)=>{
        if(user){
            await saveUserToFirestore(user, user.isAnonymous, user.displayName);
            authScreen.style.display='none';
            mainPanel.style.display='block';
        } else {
            authScreen.style.display='flex';
            mainPanel.style.display='none';
        }
    });
    
    googleBtn.onclick = ()=> signInWithPopup(auth, new GoogleAuthProvider());
    guestBtn.onclick = async()=> {
        const cred = await signInAnonymously(auth);
        const randomName = "Viajero@"+Math.floor(Math.random()*1000);
        await saveUserToFirestore(cred.user, true, randomName);
    };
    
    // Modales
    function openModal(id){ document.getElementById(id).style.display='flex'; }
    function closeModals(){ document.querySelectorAll('.modal').forEach(m=>m.style.display='none'); }
    document.querySelectorAll('.closeModal').forEach(btn=>btn.addEventListener('click',closeModals));
    document.getElementById('createRoomBtn').onclick = ()=> openModal('createRoomModal');
    document.getElementById('joinRoomBtn').onclick = ()=> openModal('joinRoomModal');
    
    // Crear sala
    document.getElementById('confirmCreateRoom').onclick = async()=>{
        if(!currentUserData) return;
        const roomName = document.getElementById('roomName').value || "Sala Pinolera";
        const maxPlayers = parseInt(document.getElementById('maxPlayers').value);
        const roundTime = parseInt(document.getElementById('roundTime').value);
        const numRounds = parseInt(document.getElementById('numRounds').value);
        const catType = document.getElementById('catType').value;
        const roomId = Math.random().toString(36).substring(2,8).toUpperCase();
        await setDoc(doc(db,"rooms",roomId),{
            roomId, roomName, host: currentUserData.uid, maxPlayers, roundTime, numRounds, catType,
            players: [{uid:currentUserData.uid, nombre:currentUserData.nombre, avatar:currentUserData.avatar, puntosRonda:0, total:0}],
            state: "waiting",
            currentRound:0,
            currentLetter: null,
            roundEndTime: null,
            stopTriggered: false
        });
        await addDoc(collection(db,"rooms",roomId,"messages"),{sender: "Sistema", text: `${currentUserData.nombre} creó la sala`, timestamp: serverTimestamp()});
        loadRoomView(roomId);
        closeModals();
    };
    
    // Unirse a sala
    document.getElementById('confirmJoinRoom').onclick = async()=>{
        const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
        const roomRef = doc(db,"rooms",code);
        const snap = await getDoc(roomRef);
        if(!snap.exists()) { alert("Sala no encontrada"); return; }
        const room = snap.data();
        if(room.players.some(p=>p.uid===currentUserData.uid)) { loadRoomView(code); closeModals(); return; }
        if(room.players.length>=room.maxPlayers) { alert("Sala llena"); return; }
        await updateDoc(roomRef,{
            players: arrayUnion({uid:currentUserData.uid, nombre:currentUserData.nombre, avatar:currentUserData.avatar, puntosRonda:0, total:0})
        });
        await addDoc(collection(db,"rooms",code,"messages"),{sender:"Sistema",text:`${currentUserData.nombre} se unió`, timestamp: serverTimestamp()});
        loadRoomView(code);
        closeModals();
    };
    
    function loadMainMenu(){
        document.getElementById('dynamicView').innerHTML = `<div class="card"><h2>🎮 Bienvenido a Stop Pinolero</h2><p>¡Crea o únete a una sala y demuestra tu conocimiento de Nicaragua!</p></div>`;
        if(unsubscribeRooms) unsubscribeRooms();
    }
    
    async function loadRoomView(roomId){
        const roomRef = doc(db,"rooms",roomId);
        const unsubRoom = onSnapshot(roomRef, async(roomSnap)=>{
            if(!roomSnap.exists()){ alert("Sala eliminada"); loadMainMenu(); return; }
            const room = roomSnap.data();
            const isHost = room.host === currentUserData.uid;
            const playersList = room.players;
            let html = `<div class="card"><h2>🏠 ${room.roomName} (Cód: ${roomId})</h2><div class="grid-2"><div><h3>Jugadores (${playersList.length}/${room.maxPlayers})</h3><ul>`;
            playersList.forEach(p=>html+=`<li>${p.avatar || '🎭'} ${p.nombre} - ${p.total} pts</li>`);
            html+=`</ul>${isHost && room.state==='waiting' ? '<button id="startGameBtn" class="btn btn-success">🚀 Iniciar Partida</button>' : '<p>⏳ Esperando al anfitrión...</p>'}</div><div><h3>💬 Chat</h3><div id="chatMessages" class="chat-box" style="height:200px"></div><input id="chatInput" placeholder="Mensaje..."><button id="sendChat">Enviar</button></div></div></div>`;
            document.getElementById('dynamicView').innerHTML = html;
            // chat listener
            const chatQuery = query(collection(db,"rooms",roomId,"messages"), orderBy("timestamp","asc"));
            onSnapshot(chatQuery, (snap)=>{
                const chatDiv = document.getElementById('chatMessages');
                if(chatDiv) chatDiv.innerHTML = snap.docs.map(d=>`<div><b>${d.data().sender}</b>: ${d.data().text}</div>`).join('');
            });
            document.getElementById('sendChat')?.addEventListener('click', async()=>{
                const msg = document.getElementById('chatInput').value;
                if(msg) await addDoc(collection(db,"rooms",roomId,"messages"),{sender:currentUserData.nombre, text:msg, timestamp: serverTimestamp()});
                document.getElementById('chatInput').value='';
            });
            if(isHost && room.state==='waiting') document.getElementById('startGameBtn')?.addEventListener('click', async()=>{
                const letter = String.fromCharCode(65+Math.floor(Math.random()*26));
                await updateDoc(roomRef,{ state: "playing", currentRound:1, currentLetter: letter, roundStart: serverTimestamp(), stopTriggered: false });
                await addDoc(collection(db,"rooms",roomId,"messages"),{sender:"Sistema",text:`¡Ronda 1! Letra ${letter}`,timestamp:serverTimestamp()});
                startRound(roomId,1,letter,room.roundTime);
            });
            if(room.state === "playing") await renderGameInterface(roomId,room);
        });
        window.currentRoomUnsub = unsubRoom;
    }
    
    async function renderGameInterface(roomId,room){
        const categories = categoriesMap[room.catType] || categoriesMap.classic;
        const html = `<div class="card"><h2>🎲 Ronda ${room.currentRound}/${room.numRounds} | Letra: ${room.currentLetter}</h2><div id="timerDisplay" style="font-size:2rem;font-weight:bold">⏱️ --</div><button id="stopBtnGlobal" class="btn btn-stop">STOP</button><form id="answersForm"><div class="category-grid" id="catsGrid"></div><button type="submit" class="btn">Guardar Respuestas</button></form></div><div id="roundResults"></div>`;
        document.getElementById('dynamicView').innerHTML = html;
        const container = document.getElementById('catsGrid');
        categories.forEach(cat=>{ container.innerHTML += `<div class="cat-input"><label>${cat}</label><input name="${cat}" placeholder="Escribe tu respuesta..."></div>` });
        let timeLeft = room.roundTime;
        const timerElem = document.getElementById('timerDisplay');
        const interval = setInterval(async()=>{
            if(timeLeft<=0){
                clearInterval(interval);
                await finishRound(roomId);
            } else {
                timerElem.innerText = `⏱️ ${timeLeft}s`;
                timeLeft--;
            }
        },1000);
        window.timerInterval = interval;
        document.getElementById('stopBtnGlobal')?.addEventListener('click', async()=>{
            if(room.stopTriggered) return;
            await updateDoc(doc(db,"rooms",roomId),{ stopTriggered: true, stopTimestamp: serverTimestamp() });
            await addDoc(collection(db,"rooms",roomId,"messages"),{sender:"Sistema",text:`${currentUserData.nombre} presionó STOP! 10 segundos restantes`,timestamp:serverTimestamp()});
            setTimeout(()=>finishRound(roomId), 10000);
        });
        document.getElementById('answersForm')?.addEventListener('submit', async(e)=>{
            e.preventDefault();
            const answers = {};
            categories.forEach(cat=>{ answers[cat] = document.querySelector(`[name="${cat}"]`).value.trim() || ""; });
            await setDoc(doc(db,"rooms",roomId,"answers",currentUserData.uid),{uid:currentUserData.uid, answers, round: room.currentRound});
        });
    }
    
    async function finishRound(roomId){
        clearInterval(window.timerInterval);
        const roomRef = doc(db,"rooms",roomId);
        const roomSnap = await getDoc(roomRef);
        const room = roomSnap.data();
        if(!room) return;
        const answersSnap = await getDocs(collection(db,`rooms/${roomId}/answers`));
        const allAnswers = {};
        answersSnap.forEach(doc=>{ allAnswers[doc.id] = doc.data(); });
        const categoriesList = categoriesMap[room.catType];
        const scores = {};
        room.players.forEach(p=>{ scores[p.uid] = 0; });
        for(let cat of categoriesList){
            const wordMap = new Map();
            for(let [uid, data] of Object.entries(allAnswers)){
                if(data.round === room.currentRound){
                    let word = data.answers[cat]?.toLowerCase().trim();
                    if(word && word!==""){
                        if(!wordMap.has(word)) wordMap.set(word,[]);
                        wordMap.get(word).push(uid);
                    }
                }
            }
            for(let [word, uids] of wordMap.entries()){
                let points = (uids.length === 1) ? 2 : 1;
                uids.forEach(uid=> scores[uid] += points);
            }
        }
        let maxScore = 0, winnerUid = null;
        for(let [uid, pts] of Object.entries(scores)){
            if(pts>maxScore){ maxScore=pts; winnerUid=uid;}
        }
        const newPlayers = room.players.map(p=>{
            let add = scores[p.uid] || 0;
            let bonus = (p.uid===winnerUid) ? 5 : 0;
            let newTotal = p.total + add + bonus;
            return {...p, puntosRonda: add+bonus, total: newTotal};
        });
        await updateDoc(roomRef,{ players: newPlayers, stopTriggered: false });
        await addDoc(collection(db,"rooms",roomId,"messages"),{sender:"Sistema",text:`Resultados ronda: ${winnerUid===currentUserData.uid ? "Ganaste la ronda!" : "Ronda finalizada"}`,timestamp:serverTimestamp()});
        if(room.currentRound >= room.numRounds){
            finalizeGame(roomId);
        } else {
            await updateDoc(roomRef,{ currentRound: increment(1), currentLetter: String.fromCharCode(65+Math.floor(Math.random()*26)), roundStart: serverTimestamp(), stopTriggered: false });
            await addDoc(collection(db,"rooms",roomId,"messages"),{sender:"Sistema",text:`Nueva Ronda ${room.currentRound+1}`,timestamp:serverTimestamp()});
        }
    }
    
    async function finalizeGame(roomId){
        const roomRef = doc(db,"rooms",roomId);
        const snap = await getDoc(roomRef);
        const room = snap.data();
        const sorted = [...room.players].sort((a,b)=>b.total-a.total);
        let winner = sorted[0];
        // actualizar estadísticas usuario
        const userRef = doc(db,"users",winner.uid);
        await updateDoc(userRef,{ victorias: increment(1), partidasJugadas: increment(1), puntosGlobales: increment(winner.total) });
        await addDoc(collection(db,"rooms",roomId,"messages"),{sender:"Sistema",text:`🏆 FIN DEL JUEGO - Ganador: ${winner.nombre} con ${winner.total} puntos`,timestamp:serverTimestamp()});
        document.getElementById('dynamicView').innerHTML = `<div class="card"><h2>🏁 Partida finalizada</h2><p>1° ${sorted[0]?.nombre} - ${sorted[0]?.total} pts<br>2° ${sorted[1]?.nombre} - ${sorted[1]?.total}<br>3° ${sorted[2]?.nombre} - ${sorted[2]?.total}</p><button onclick="location.reload()">Volver al inicio</button></div>`;
        await updateDoc(roomRef,{ state: "finished" });
    }
    
    async function startRound(roomId,round,letter,timeSec){
        // ya implementado
    }
    
    // Ranking global
    document.getElementById('rankingBtn').onclick = async()=>{
        const q = query(collection(db,"users"), orderBy("puntosGlobales","desc"), limit(20));
        const snap = await getDocs(q);
        let rankHtml = `<div class="card"><h2>🏆 Ranking Global</h2><ol>`;
        snap.forEach(doc=>{ let d=doc.data(); rankHtml+=`<li>${d.nombre} - ${d.puntosGlobales||0} pts - ${d.nivel}</li>`; });
        rankHtml+=`</ol></div>`;
        document.getElementById('dynamicView').innerHTML = rankHtml;
    };
    
    // Amigos
    document.getElementById('friendsBtn').onclick = async()=>{
        const friendsRef = collection(db,"friends");
        const q = query(friendsRef, where("usuario","==",currentUserData.uid), where("estado","==","aceptado"));
        const snap = await getDocs(q);
        let html = `<div class="card"><h2>👥 Amigos</h2><input id="searchFriend" placeholder="Buscar por nombre"><button id="searchBtn">Buscar</button><ul id="friendList">`;
        snap.forEach(d=>html+=`<li>${d.data().amigoNombre || d.data().amigo}</li>`);
        html+=`</ul></div>`;
        document.getElementById('dynamicView').innerHTML = html;
        document.getElementById('searchBtn').onclick = async()=>{
            const search = document.getElementById('searchFriend').value;
            const userQuery = query(collection(db,"users"), where("nombre",">=",search), where("<=",search+"\uf8ff"), limit(5));
            const res = await getDocs(userQuery);
            let list = '<h4>Resultados</h4>';
            res.forEach(u=>{
                if(u.id !== currentUserData.uid) list+=`<div>${u.data().nombre} <button class="sendRequestBtn" data-uid="${u.id}">➕ Agregar</button></div>`;
            });
            document.getElementById('friendList').innerHTML = list;
            document.querySelectorAll('.sendRequestBtn').forEach(btn=>btn.addEventListener('click', async()=>{
                const friendId = btn.dataset.uid;
                await setDoc(doc(db,"friends",`${currentUserData.uid}_${friendId}`),{usuario:currentUserData.uid, amigo:friendId, estado:"pendiente", amigoNombre: (await getDoc(doc(db,"users",friendId))).data().nombre });
                alert("Solicitud enviada");
            }));
        };
    };
    
    // Perfil y configuración
    document.getElementById('profileBtn').onclick = ()=>{
        const user = currentUserData;
        document.getElementById('dynamicView').innerHTML = `<div class="card"><h2>👤 Mi Perfil</h2><p>Avatar: ${user.avatar}</p><p>Nombre: ${user.nombre}</p><p>Nivel: ${user.nivel}</p><p>Exp: ${user.experiencia}</p><p>Puntos: ${user.puntosGlobales}</p><p>Partidas Jugadas: ${user.partidasJugadas}</p><p>Victorias: ${user.victorias}</p><button id="toggleDark">🌙 Modo Oscuro</button> <button id="shareProfile">🔗 Compartir Perfil</button></div>`;
        document.getElementById('toggleDark')?.addEventListener('click',()=>{ document.body.classList.toggle('dark'); localStorage.setItem('darkMode',document.body.classList.contains('dark')); });
        document.getElementById('shareProfile')?.addEventListener('click',()=>{ alert(`Comparte: https://stoppinolero.com/u/${currentUserData.uid}`); });
        if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark');
    };
    document.getElementById('settingsBtn').onclick = ()=>{
        document.getElementById('dynamicView').innerHTML = `<div class="card"><h2>⚙️ Configuración</h2><label><input type="checkbox" id="soundToggle"> Activar Sonidos</label><button id="saveSettings">Guardar</button></div>`;
        document.getElementById('saveSettings').onclick = ()=>{ alert("Preferencias guardadas"); };
    };
    if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark');
    window.loadRoomView = loadRoomView;
</script>
</body>
</html>
